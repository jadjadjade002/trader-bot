name: Oracle Always Free capacity

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: oracle-always-free-capacity
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check -r scripts/oracle_watch_requirements.txt
      - run: python -m unittest discover -s tests -p test_oracle_free_capacity.py -v
      - name: Validate SDK launch storage model
        run: >-
          python -c "import oci;
          source=oci.core.models.InstanceSourceViaImageDetails(image_id='validation-only',
          boot_volume_size_in_gbs=50,boot_volume_vpus_per_gb=10);
          assert source.boot_volume_size_in_gbs==50 and source.boot_volume_vpus_per_gb==10;
          print('Oracle SDK model valid')"
  check:
    if: vars.ORACLE_WATCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check -r scripts/oracle_watch_requirements.txt
      - name: Check capacity and email on success
        run: python scripts/oracle_free_capacity.py
        env:
          OCI_CONFIG_JSON: ${{ secrets.OCI_CONFIG_JSON }}
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          SMTP_USER: ${{ secrets.ORACLE_NOTIFY_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.ORACLE_NOTIFY_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.ORACLE_NOTIFY_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
          ORACLE_WORKFLOW_FILE: oracle-free-capacity.yml
